[project]
name = "citadel"
version = "0.1.0"
description = "RAG over university academic documents, with an evaluation harness"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pymupdf>=1.26",
    "beautifulsoup4>=4.12",
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2.2",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "numpy>=1.26",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "trafilatura>=2.0",
    "torch>=2.4",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[project.scripts]
citadel = "citadel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# CPU-only PyTorch on Linux (CI, servers): the default Linux wheels bundle ~3 GB of CUDA
# libraries this project never uses. macOS wheels are CPU/MPS already.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["backend/citadel"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["citadel"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
